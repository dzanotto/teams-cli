name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Stable version tag to package after validation
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test, build, and check CLI help and version
        shell: bash
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
          if [[ "$EXPECTED_ARCH" == arm64 ]]; then
            swift test --enable-code-coverage
            bash scripts/sonar-coverage.sh
          else
            swift test
          fi
          bash scripts/build-release.sh "${RELEASE_TAG:-v0.0.0}"
          .build/release/teams-cli --help
          .build/release/teams-cli --version
      - name: Check release packaging
        shell: bash
        run: bash scripts/package-release.sh "${RELEASE_TAG:-v0.0.0}" "$EXPECTED_ARCH"
      - name: Upload release archive
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teams-cli-macos-${{ matrix.arch }}
          path: .build/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Check SonarQube Cloud configuration
        id: sonar
        if: >-
          matrix.arch == 'arm64' && inputs.release_tag == '' &&
          (github.event_name == 'push' || github.event_name == 'pull_request') &&
          github.ref_type != 'tag' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          github.actor != 'dependabot[bot]'
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SONAR_ORGANIZATION" && -z "$SONAR_PROJECT_KEY" && -z "$SONAR_TOKEN" ]]; then
            echo 'SonarQube Cloud is not configured. Set SONAR_ORGANIZATION and SONAR_PROJECT_KEY repository variables and the SONAR_TOKEN secret to enable analysis.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" || -z "$SONAR_TOKEN" ]]; then
            echo '::error::Set SONAR_ORGANIZATION and SONAR_PROJECT_KEY variables and the SONAR_TOKEN secret.'
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Analyze with SonarQube Cloud
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
