name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Stable version tag to package after validation
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test, build, and check CLI help
        shell: bash
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
          swift test
          swift build -c release
          .build/release/teams-cli --help
      - name: Check release packaging
        shell: bash
        run: bash scripts/package-release.sh "${RELEASE_TAG:-v0.0.0}" "$EXPECTED_ARCH"
      - name: Upload release archive
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teams-cli-macos-${{ matrix.arch }}
          path: .build/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
